<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CardCraft Launch Poster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 450px;
    height: 600px;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0e0f0c;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 32px;
    position: relative;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(159, 232, 112, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(159, 232, 112, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* Accent glow */
  body::after {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(159, 232, 112, 0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  .top { position: relative; z-index: 1; text-align: center; }

  .badge {
    display: inline-block;
    background: rgba(159, 232, 112, 0.12);
    border: 1px solid rgba(159, 232, 112, 0.3);
    color: #9fe870;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 28px;
  }

  .logo {
    margin-bottom: 20px;
  }

  .logo svg {
    width: 280px;
    height: auto;
  }

  .tagline {
    font-size: 15px;
    color: #a0a3a0;
    margin-top: 4px;
  }

  .middle {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .headline {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }

  .headline span {
    color: #9fe870;
  }

  .features {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }

  .feature {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    color: #ccc;
  }

  .bottom {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
  }

  .url {
    display: inline-block;
    background: #9fe870;
    color: #0e0f0c;
    font-weight: 800;
    font-size: 14px;
    padding: 12px 28px;
    border-radius: 8px;
    letter-spacing: 0.3px;
    margin-bottom: 14px;
  }

  .footer {
    font-size: 11px;
    color: #666;
    letter-spacing: 0.5px;
  }

  /* Decorative card shapes */
  .card-shape {
    position: absolute;
    border-radius: 8px;
    border: 1.5px solid rgba(159, 232, 112, 0.15);
    z-index: 0;
  }
  .card-shape-1 {
    width: 100px;
    height: 60px;
    bottom: 120px;
    left: -20px;
    transform: rotate(-12deg);
  }
  .card-shape-2 {
    width: 90px;
    height: 54px;
    bottom: 160px;
    right: -15px;
    transform: rotate(8deg);
    border-color: rgba(159, 232, 112, 0.08);
  }
  .card-shape-3 {
    width: 80px;
    height: 48px;
    top: 200px;
    left: 10px;
    transform: rotate(5deg);
    border-color: rgba(159, 232, 112, 0.06);
  }
</style>
</head>
<body>
  <div class="card-shape card-shape-1"></div>
  <div class="card-shape card-shape-2"></div>
  <div class="card-shape card-shape-3"></div>

  <div class="top">
    <div class="badge">Now Live</div>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img">
        <g transform="translate(40, 30)">
          <path d="M84 18H30C20.1 18 12 26.1 12 36v36c0 9.9 8.1 18 18 18h54"
                stroke="#9fe870" stroke-width="9" stroke-linecap="round" fill="none"/>
          <rect x="66" y="30" width="36" height="48" rx="6" fill="#0e0f0c" opacity="0.6"/>
        </g>
        <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" letter-spacing="-2">
          <text x="170" y="90" font-size="84" fill="#ffffff">Card</text>
          <text x="356" y="90" font-size="84" fill="#9fe870">Craft</text>
        </g>
      </svg>
    </div>
    <div class="tagline">A business card studio that thinks for you.</div>
  </div>

  <div class="middle">
    <div class="headline">One prompt.<br/><span>Infinite designs.</span></div>
    <div class="features">
      <div class="feature">52 Templates</div>
      <div class="feature">AI-Powered</div>
      <div class="feature">Live Editor</div>
      <div class="feature">Print-Ready</div>
      <div class="feature">No Sign-up</div>
    </div>
  </div>

  <div class="bottom">
    <div class="url">cardcraft.onslate.com</div>
    <div class="footer">Free · No accounts · Runs in your browser</div>
  </div>
</body>
</html>
